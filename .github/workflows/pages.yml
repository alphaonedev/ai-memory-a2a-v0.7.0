name: Publish GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "runs/**"
      - "mkdocs.yml"
      - "scripts/render_pages.py"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["A2A v0.7.0 campaign (single round)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install mkdocs-material
        run: pip install mkdocs-material

      - name: Re-render index.html from latest run
        run: |
          python3 scripts/render_pages.py || true

      - name: Build site
        run: mkdocs build

      - name: Mirror runs/ to site/evidence/ for offline-evidence links
        run: |
          set -euo pipefail
          mkdir -p site/evidence
          if [ -d runs ]; then cp -r runs/. site/evidence/ || true; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
